<title>일본어 회화 · RINO</title>
<link rel="manifest" href="japanese.webmanifest">
<link rel="icon" href="japanese-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="japanese-icon-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--olive:#6B7A5A;--olive-d:#566348;--teal:#5A7D7C;--bg:#F7F5EF;--ink:#22231F;--mut:#7C7E74;--line:#CFCDC2;--tile:#CED2BD;--card:#fff;--dot:#FF5A00;
  --serif:"Playfair Display","Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#E9E6DC;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{overflow-x:hidden;max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
#view{flex:1;padding:calc(18px + env(safe-area-inset-top)) 22px 110px}
#view.flush{padding-left:0;padding-right:0;padding-top:0}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;letter-spacing:.04em;color:var(--teal);padding:6px 0;border-radius:14px}
#tabs button[aria-current=page]{color:var(--olive-d);font-weight:700;background:rgba(107,122,90,.14)}
.caps{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.caps.teal{color:var(--teal)}
.serif{font-family:var(--serif)}
.rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--olive);background:rgba(107,122,90,.16);border-radius:999px;padding:5px 11px;font-size:11px;letter-spacing:.08em;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--olive);color:#fff;padding:16px;font-size:16px;font-weight:600;letter-spacing:.06em;border-radius:2px}
.btn.round{border-radius:999px}
.btn:active{background:var(--olive-d)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--teal);font-weight:500;font-size:13px;padding:12px 10px}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.row>.btn{flex:1}
h1,h2,h3,p{margin:0}
.back{width:36px;height:36px;display:grid;place-items:center;margin-left:-8px;flex:none}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.jps{font-family:"Hiragino Sans","Noto Sans JP",var(--sans)}
.note{font-size:12px;line-height:1.6;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;line-height:1.5;padding:10px 16px;border-radius:12px;max-width:min(420px,88vw);z-index:30;text-align:center}

/* 홈 */
.hello{font-family:var(--serif);font-size:26px;font-weight:400;word-break:keep-all}
.mission{padding:0 6px}
.mission h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.2;margin:10px 0 14px;word-break:keep-all}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod{min-width:0;background:var(--tile);border:1px solid rgba(34,35,31,.35);aspect-ratio:1/1.02;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 8px;text-align:center}
.mod b{font-family:var(--serif);font-weight:400;font-size:24px}
.mod .caps{font-size:9.5px;letter-spacing:.1em;color:var(--ink)}
.mod .ic{color:var(--teal);height:44px;display:grid;place-items:center}
.ring{position:relative;width:46px;height:46px}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--teal)}

/* 회화 */
.avatar{width:54px;height:54px;border-radius:50%;background:var(--olive);color:#F7F5EF;display:grid;place-items:center;font-family:var(--serif);font-size:22px;flex:none}
.avatar.s{width:34px;height:34px;font-size:14px}
.coll{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;margin:16px 0 8px;text-align:center;font-family:var(--serif);font-size:16px;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--teal);border-radius:999px;overflow:hidden;margin:12px auto 0;width:max-content}
.seg button{padding:7px 16px;font-size:12px;letter-spacing:.04em;color:var(--teal)}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff}
.msgs{display:flex;flex-direction:column;gap:12px;margin:18px 0 16px}
.tb{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 6px 18px rgba(90,125,124,.14);max-width:92%;align-self:flex-start}
.tb .ja{font-size:19px;font-weight:700;line-height:1.5;margin-top:8px}
.rd{font-size:13px;color:var(--mut);line-height:1.6;margin-top:2px}
.hg{font-size:12.5px;color:var(--teal);line-height:1.6}
.ko{font-size:14px;line-height:1.5;margin-top:8px;padding:9px 12px;background:#EEF1F0;border-radius:12px}
.fb{font-size:13px;line-height:1.55;margin-top:8px;padding:9px 12px;border-left:2px solid var(--dot);background:#FBF3EC}
.ub{background:var(--olive);color:#F7F5EF;border-radius:20px;padding:13px 16px;max-width:88%;align-self:flex-end;box-shadow:0 6px 14px rgba(86,99,72,.25)}
.ub .ja{font-size:18px;font-weight:600;line-height:1.5}
.ub .rd,.ub .hg{color:rgba(247,245,239,.85)}
.score{align-self:flex-end;border:1px solid var(--line);background:#F1EEE4;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.model{align-self:flex-end;max-width:88%;border:1px dashed var(--teal);border-radius:16px;padding:10px 14px}
.model .ja{font-size:16px;font-weight:600;line-height:1.5}
.sys{align-self:center;text-align:center;font-size:13px;color:var(--mut);line-height:1.6}
.spk{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.spk.lg{width:46px;height:46px}
.hintbtn{align-self:flex-end;border:1px solid var(--teal);color:var(--teal);border-radius:12px;padding:8px 16px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.talk{background:#EDF1F1;border-radius:20px;padding:14px 14px 16px;text-align:center}
.talk .st{font-size:14px;min-height:21px}
.wave{display:flex;gap:3px;justify-content:center;align-items:center;height:30px;margin:6px 0 10px;color:var(--teal)}
.wave i{width:3px;height:6px;border-radius:2px;background:currentColor;opacity:.5}
.on .wave i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave i:nth-child(3n){animation-delay:.15s}.wave i:nth-child(3n+1){animation-delay:.3s}.wave i:nth-child(4n){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.mic{background:var(--olive);color:#fff;border-radius:999px;padding:10px 38px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600}
.on .mic{background:var(--dot)}
.inp{display:flex;gap:6px;align-items:center;border:1px solid var(--teal);border-radius:16px;background:#E9EEEC;padding:6px 8px 6px 14px;margin-top:12px}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;padding:8px 0}
.inp button{color:var(--teal);width:38px;height:38px;display:grid;place-items:center}

/* 코스 */
.chead{background:var(--teal);color:#F7F5EF;padding:calc(20px + env(safe-area-inset-top)) 22px 34px}
.chead h1{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.05;letter-spacing:.03em}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:10px 16px;margin-top:16px;color:var(--ink)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.cbody{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-18px;padding:18px 22px 0}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv button{border:1.5px solid var(--teal);border-radius:16px;padding:11px 0;font-size:18px;font-weight:700;color:var(--teal)}
.lv button[aria-pressed=true]{background:var(--olive);border-color:var(--olive-d);color:#fff}
.ccard{position:relative;display:flex;gap:14px;align-items:center;background:#FBFAF6;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(34,35,31,.09);margin-bottom:14px}
.ccard>.dot{position:absolute;top:12px;right:12px}
.thumb{width:68px;height:68px;border-radius:12px;background:var(--tile);color:var(--olive-d);display:grid;place-items:center;font-size:34px;flex:none}
.ccard h3{font-family:var(--serif);font-weight:400;font-size:20px;word-break:keep-all}
.badge{background:var(--olive);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:3px 6px}
.bar{height:7px;border-radius:99px;background:#E1DFD5;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--olive);border-radius:99px}
.go{width:46px;height:46px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;flex:none}
.link{font-size:12px;color:var(--teal);text-decoration:underline;text-underline-offset:3px}

/* 발음 */
.sent{font-size:26px;line-height:1.45;margin:8px 0 4px;word-break:break-all}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--teal);border-radius:10px;height:84px;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;font-size:14px;line-height:1.5;text-align:center}
.box svg,.box canvas{width:100%;height:100%}
.miss{color:var(--dot);font-weight:700;text-decoration:underline}
.chip{display:flex;align-items:center;gap:10px;border:1px solid var(--teal);border-radius:999px;padding:9px 14px;font-size:13px;margin-bottom:10px}
.chip .ci{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--teal);display:grid;place-items:center;color:var(--teal);flex:none}
.chip.warn .ci{border-color:var(--dot);color:var(--dot)}
.circle{width:112px;height:112px;border-radius:50%;border:3px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.circle b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}

/* 단어장 */
.vt{width:calc(100% + 12px);margin:0 -6px;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.vt th:first-child{width:30px}.vt th:nth-child(2){width:23%}.vt th:nth-child(3){width:25%}.vt th:nth-child(4){width:25%}
.vt th{font-size:13px;font-weight:600;color:var(--teal);padding:8px 2px;text-align:left}
.vt td{overflow-wrap:anywhere;letter-spacing:-.02em;padding:10px 2px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:keep-all}
.vt td:nth-child(2){font-weight:700}
.vt td:nth-child(4){font-size:11.5px}
.vt td:last-child{overflow-wrap:normal}
.vt td:nth-child(4){color:var(--mut)}
.num{width:26px;height:26px;border-radius:50%;font-size:11px;color:var(--olive-d);border:1px solid var(--line);display:grid;place-items:center}
.num.ok{background:var(--olive);border-color:var(--olive);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));text-align:center}
.flash{font-size:46px;margin:22px 0 10px}

/* 마이 */
.stat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.stat div{padding:14px 4px;text-align:center;border-right:1px solid var(--line)}
.stat div:last-child{border:0}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:26px}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11px;color:var(--mut)}
.week i{width:100%;max-width:26px;background:var(--tile);border-radius:3px 3px 0 0;min-height:2px}
.week .t i{background:var(--olive)}
.field{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.field input[type=text],.field input[type=password],.field select{flex:1;min-width:0;border:0;outline:0;background:none;text-align:right;font-size:14px}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:#C9C7BC;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
.sw[aria-checked=true]{background:var(--teal)}
.sw[aria-checked=true]::after{left:22px}
</style>
</head>

function compare(target, heard) {

  for (let i = a.length, j = b.length; i > 0 && j > 0;) {

/* ───────── 발음 / 쉐도잉 ───────── */
let sh = null;         // { cid, i, res, listening, modelDur }
function openShadow(cid) {
  const c = course(cid); S.cur = c.id; save();
  let i = c.shadow.findIndex((_, k) => (prog(c.id).shadow[k] || 0) < SHADOW_PASS);
  sh = { cid: c.id, i: Math.max(0, i), res: null, listening: false, modelDur: {} };
  go('shadow');
}
// 박(모라) 리듬: 보통 박 1, 긴소리 ー 는 이어지는 박, っ 는 쉬는 박
function rhythm(rd) {
  const out = [];
  for (const ch of toHira(rd).replace(/[^ぁ-ゖー]/g, '')) {
    if ('ゃゅょぁぃぅぇぉ'.includes(ch)) continue;
    out.push(ch === 'っ' ? 0.18 : ch === 'ー' ? 0.75 : ch === 'ん' ? 0.6 : 1);
  }
  return out;
}
function drawWave() {
  const cv = document.getElementById('wave'); if (!cv || !sh?.res?.peaks) return;
  const w = cv.width = cv.clientWidth * 2, h = cv.height = cv.clientHeight * 2, g = cv.getContext('2d'), p = sh.res.peaks, max = Math.max(...p, 0.01);
  g.fillStyle = '#5A7D7C';
  p.forEach((v, i) => { const bh = Math.max(3, v / max * h * 0.9), bw = w / p.length; g.fillRect(i * bw + bw * 0.2, (h - bh) / 2, bw * 0.6, bh); });
}
VIEWS.shadow = () => {
  const c = course(sh.cid), l = c.shadow[sh.i], n = c.shadow.length, done = shadowDone(c), r = sh.res, best = prog(c.id).shadow[sh.i] || 0;
  const beats = rhythm(l.rd), bw = 100 / beats.length;
  const model = sh.modelDur[sh.i], bad = r ? missed(r) : [];
  let pace = null;
  if (r?.dur && model) { const d = r.dur - model; pace = Math.abs(d) <= Math.max(0.35, model * 0.2) ? ['속도 — 좋아요', false, ''] : d < 0 ? ['속도 — 조금 빨라요', true, `모델보다 ${(-d).toFixed(1)}초 짧게 말했어요. 한 박씩 또박또박, 조금 더 천천히 말해 보세요.`] : ['속도 — 조금 느려요', true, `모델보다 ${d.toFixed(1)}초 길었어요. 끊지 말고 한 호흡에 이어서 말해 보세요.`]; }
  return `
  <div class="row"><button class="back" data-go="courses" aria-label="코스 목록">${I('back', 26)}</button><h1 class="serif grow" style="font-size:26px;font-weight:400;text-align:center;margin-right:28px">발음 연습 ${sh.i + 1}/${n}</h1></div>

  <hr class="rule">

  <hr class="rule" style="margin:12px 0">
  <div class="row"><p class="serif grow" style="font-size:16px;line-height:1.5">${esc(l.ko)}</p><button data-act="model" style="display:grid;justify-items:center;gap:3px;font-size:12px"><span class="spk lg">${I('spk', 24)}</span>듣기</button></div>

    <div><p style="font-size:14px;margin-bottom:8px">● 내 녹음</p><div class="box jps">${sh.listening ? '듣고 있어요…' : r ? (r.peaks ? '<canvas id="wave"></canvas>' : r.chars.map((ch, k) => r.hit[k] ? esc(ch) : `<span class="miss">${esc(ch)}</span>`).join('')) : '<span class="note">녹음하면 여기에 보여요</span>'}</div></div>

  <button class="btn round" style="margin-top:18px;${sh.listening ? 'background:var(--dot)' : ''}" data-act="record" ${SR ? '' : 'disabled'}>${sh.listening ? '멈추기 · STOP' : 'RECORD · 녹음하기'}</button>
  ${SR ? '' : '<p class="note" style="margin-top:8px;text-align:center">이 브라우저는 음성 인식을 지원하지 않아요. Chrome 또는 Safari에서 열어 주세요.</p>'}
  <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="model">${I('loop', 16)} 모델 다시 듣기</button><button class="btn ghost" data-act="mine" ${r?.url ? '' : 'disabled'}>${I('loop', 16)} 내 녹음 재생</button></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="prev" ${sh.i ? '' : 'disabled'}>← 이전 문장</button><button class="btn ghost" data-act="next" ${sh.i < n - 1 ? '' : 'disabled'}>다음 문장 →</button></div>`;
};
async function shadowModel() { const i = sh.i, d = await speak(course(sh.cid).shadow[i].ja); if (d && sh) sh.modelDur[i] = d; }
async function shadowRecord() {
  if (sh.listening) { rec?.stop(); return; }
  sh.listening = true; render();
  const r = await listen();
  sh.listening = false;
  if (r) {
    const c = course(sh.cid), g = grade(c.shadow[sh.i], r.alts);
    sh.res = { ...g, dur: r.dur, url: r.url, peaks: r.peaks };
    const p = prog(c.id); p.shadow[sh.i] = Math.max(p.shadow[sh.i] || 0, g.score);
    touch();
  }
  render();
}

function startQuiz() {

/* ───────── 이벤트 ───────── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-chat],[data-shadow],[data-act],[data-say],[data-lv],[data-mode],[data-learn],[data-word],[data-sw],[data-stop]');
  if (!t) return;
  const d = t.dataset;
  if ('stop' in d) { const inner = e.target.closest('[data-act]'); if (!inner || inner === t.parentElement) return; return act(inner.dataset.act); }
  if (d.go) return d.go === 'chat' ? openChat(chat?.cid || mission().id) : go(d.go);
  if (d.chat) return openChat(d.chat);
  if (d.shadow) return openShadow(d.shadow);
  if (d.say) return speak(chat.msgs[d.say].ja);
  if ('lv' in d) { lvFilter = d.lv; query = ''; return render(); }
  if (d.mode) {
    if (d.mode === 'ai' && !S.key) return toast('AI 자유 회화는 마이페이지 → 설정에 API 키를 넣으면 쓸 수 있어요.');
    chat.mode = d.mode; chat.hint = false; return render();
  }
  if (d.learn) { const i = Number(d.learn); S.vocab = S.vocab.includes(i) ? S.vocab.filter((x) => x !== i) : [...S.vocab, i]; touch(); return render(); }
  if (d.word) return speak(VOCAB[d.word][0]);
  if (d.sw) { S[d.sw] = !S[d.sw]; save(); return render(); }
  if (d.act) return act(d.act);
});
function act(a) {
  const c = chat && course(chat.cid);
  if (a === 'talk') return chatTalk();
  if (a === 'hint') { chat.hint = true; return render(); }
  if (a === 'sayhint') return speak(c.turns[chat.turn][1].ja);
  if (a === 'restart') return openChat(chat.cid, true);
  if (a === 'model') return shadowModel();
  if (a === 'record') return shadowRecord();
  if (a === 'mine') return sh.res?.url && new Audio(sh.res.url).play();
  if (a === 'prev' || a === 'next') { sh.i += a === 'next' ? 1 : -1; sh.res = null; render(); return shadowModel(); }
  if (a === 'quiz') return startQuiz();
  if (a === 'quizclose') { quiz = null; return render(); }
  if (a === 'quizsay') return speak(VOCAB[quiz.list[quiz.k]][0]);
  if (a === 'quizopen') { quiz.open = true; return render(); }
  if (a === 'quizyes' || a === 'quizno') return quizNext(a === 'quizyes');
  if (a === 'reset' && confirm('코스 진행률, 단어, 학습 시간 기록을 모두 지울까요? 이름과 설정은 그대로 남아요.')) { S.days = {}; S.prog = {}; S.vocab = []; chat = null; save(); render(); toast('학습 기록을 지웠어요.'); }
}
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = e.target.q?.value.trim();
  if (e.target.dataset.form === 'chat' && q && !chat.busy) chatSubmit([q], false);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    query = e.target.value.trim(); render();
    const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset.set; if (!k) return;
  S[k] = k === 'rate' ? Number(e.target.value) : e.target.value.trim() || (k === 'name' ? '리노' : k === 'model' ? 'claude-opus-5-5' : '');
  save(); if (k === 'name') render();
});
render();
</script>
<script src="home-btn.js" defer></script>
</body>
