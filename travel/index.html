<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<!-- 광고(애드센스)는 config.js 에 게시자 ID를 넣었을 때만 불러와요. 아래 구글 주소들은 그때 광고가 뜨도록 허용해 둔 거예요. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://fundingchoicesmessages.google.com https://ep2.adtrafficquality.google; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://pagead2.googlesyndication.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://fundingchoicesmessages.google.com https://googleads.g.doubleclick.net; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com https://ep2.adtrafficquality.google; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>여행 숙소 지도</title>
<meta name="description" content="도시별 추천 숙소 지도와 이달의 여행지 날씨">
<link rel="stylesheet" href="../fonts/ibm-plex-sans-kr/font.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<header class="hero">
  <h1 id="title">여행 숙소 지도</h1>
  <p id="subtitle" class="sub"></p>
  <form id="find" class="find" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="도시·동네 검색 (예: 후쿠오카, 하카타)" aria-label="도시 검색"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" enterkeyhint="search">
    <button class="find-go" type="submit" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M15.5 15.5 20 20m-3-9.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg></button>
    <div id="results" class="results" role="listbox" hidden></div>
  </form>
  <div id="quick" class="quick" aria-label="바로가기"></div>
</header>

<main class="wrap">
  <section class="sec" aria-labelledby="cities-h">
    <h2 id="cities-h">도시별 숙소</h2>
    <div id="cities" class="city-grid reveal"></div>
  </section>

  <aside id="ad-top" class="ad" hidden aria-label="광고"><span class="ad-label">광고</span></aside>

  <section class="sec" id="weather" aria-labelledby="weather-h">
    <div class="sec-head">
      <h2 id="weather-h">이달의 여행지 날씨</h2>
      <div class="seg" role="group" aria-label="달 선택">
        <button type="button" data-m="0" class="on">이번 달</button>
        <button type="button" data-m="1">다음 달</button>
      </div>
    </div>
    <p id="weather-note" class="note"></p>
    <div id="weather-row" class="weather-row reveal"></div>
    <p class="source">기온·강수: 일본 도시는 일본 기상청(JMA) 평년값(1991~2020), 그 밖의 도시는 미국 NOAA NCEI 관측값(2015~2024 평균). 실제 날씨는 해마다 달라요.</p>
  </section>
</main>

<footer class="foot">
  <p id="disclosure"></p>
  <details id="credits" class="credits" hidden>
    <summary>사진 출처</summary>
    <ul id="credit-list"></ul>
    <p>사진은 원본을 4:3으로 자르고 크기를 줄였어요. 각 사진의 라이선스를 따라요.</p>
  </details>
</footer>

<div id="backdrop" class="backdrop" hidden></div>
<article id="wx" class="wx-modal" role="dialog" aria-modal="true" aria-labelledby="wx-title" hidden>
  <button id="wx-close" class="wx-close" type="button" aria-label="닫기">✕</button>
  <h3 id="wx-title"></h3>
  <p id="wx-sub" class="note"></p>
  <table class="wx-table">
    <thead><tr><th scope="col">월</th><th scope="col">최고</th><th scope="col">최저</th><th scope="col">강수</th><th scope="col">옷차림</th></tr></thead>
    <tbody id="wx-body"></tbody>
  </table>
  <p id="wx-src" class="source"></p>
  <div id="wx-actions" class="wx-actions"></div>
</article>

<script src="config.js"></script>
<script src="home.js"></script>
<script src="../home-btn.js" defer></script>
</body>
</html>
