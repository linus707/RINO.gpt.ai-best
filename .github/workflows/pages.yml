name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r travel-map _site/travel-map && rm -rf _site/travel-map/worker
          cp -r travel _site/travel
          cp -r fonts _site/fonts
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
          cp index.html home-btn.js price.html buy.html pos.html translate.html japanese.html japanese.webmanifest japanese-icon.svg japanese-icon-*.png prices.json store-prices.json pos-price-template.xlsx pos-price-store.xlsx offline.html sw.js manifest.webmanifest icon.svg icon-*.png CNAME _site/
      - name: Stamp build id into POS
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/pos.html
      - name: Put login server address into the site
        run: node scripts/inject-auth.mjs _site/index.html
        env:
          SYNC_GIST_TOKEN: ${{ secrets.SYNC_GIST_TOKEN }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
