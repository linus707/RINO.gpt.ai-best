name: Security tests
# 방화벽이 공격을 막는지 자동으로 확인해요(tests/ 폴더의 AI 해커 테스트).
# 보안·테스트 코드가 바뀌면 자동으로 돌고, Actions 탭에서 수동 실행도 돼요.
on:
  push:
    paths:
      - 'worker/**'
      - 'tests/**'
      - 'index.html'
      - 'pos.html'
      - 'price.html'
      - 'translate.html'
      - 'japanese.html'
      - 'offline.html'
      - '.github/workflows/security-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/**'
      - 'index.html'
      - 'pos.html'
      - 'price.html'
      - 'translate.html'
      - 'japanese.html'
      - 'offline.html'
      - '.github/workflows/security-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    name: 워커 방화벽 (단위 + 공격)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 단위 테스트
        run: node tests/firewall-unit.mjs
      - name: 공격 테스트
        run: node tests/worker-firewall.mjs

  pages:
    name: 페이지 방화벽 (CSP·클릭재킹)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 브라우저가 미리 설치된 공식 Playwright 컨테이너에서 돌려, 러너 OS와 무관하게 동작해요.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Playwright 패키지 준비
        run: npm i --no-save --no-audit --no-fund playwright@1.56.0
      - name: 페이지 테스트
        run: node tests/pages-csp.mjs
