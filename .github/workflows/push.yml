name: Send push notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        run: npm i --no-save --no-audit --no-fund web-push@3.6.7
      - name: Send
        run: node scripts/push-send.mjs
        env:
          SYNC_GIST_TOKEN: ${{ secrets.SYNC_GIST_TOKEN }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
