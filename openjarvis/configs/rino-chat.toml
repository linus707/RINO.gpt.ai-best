# 리노 - 가벼운 대화용 (도구 없음)
# 적용: cp openjarvis/configs/rino-chat.toml ~/.openjarvis/config.toml
[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:4b"      # 느리면 유지, 품질이 아쉬우면 qwen3.5:9b
temperature = 0.7                  # 아이디어 발상용으로 약간 높게

[agent]
default_agent = "simple"

[server]
host = "127.0.0.1"
port = 8000
