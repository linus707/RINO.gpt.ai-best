<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>가격표 · Linus Company</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--accent:#c8553d;--bg:#f2f2f7;--tx:#1c1c1e;--mut:#6c6c70;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--card:#fff}
@media (prefers-color-scheme:dark){:root{--accent:#d47a68;--bg:#000;--tx:#f5f5f7;--mut:#98989f;--sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.28);--card:#1c1c1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:26px;margin:0;flex:1}
a.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search],select{font:inherit;font-size:15px;padding:11px 12px;border:0;border-radius:12px;background:var(--fill);color:var(--tx);min-width:0}
input[type=search]{flex:2 1 240px}select{flex:1 1 150px}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--fill);color:var(--tx)}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:4px 4px 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--sep);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.code{color:var(--mut);font-size:12px;white-space:nowrap}
.cat{display:inline-block;font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:2px 6px;margin-bottom:3px}
.priv{display:none}
body.has-priv .priv{display:table-cell}
.more{display:block;width:100%;margin-top:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.local{margin-top:20px;font-size:13px;color:var(--mut);line-height:1.6}
.local label{color:var(--accent);font-weight:600;cursor:pointer}
@media (max-width:640px){th.code,td.code{display:none}td,th{padding:9px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>💲 가격표</h1><a class="back" href="./">← Linus Company</a></header>
  <p class="sub" id="meta">불러오는 중…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="상품명·코드 검색 (예: 협탁, A210186)" autocomplete="off">
    <select id="cat"><option value="">전체 분류</option></select>
  </div>
  <div class="info"><span id="count"></span><span>제목을 누르면 정렬돼요</span></div>
  <div class="card"><table>
    <thead><tr>
      <th class="code" data-k="0">코드</th><th data-k="2">상품명</th>
      <th class="n" data-k="3">판매가</th><th class="n priv" data-k="4">출고가</th><th class="n priv" data-k="5">공급가</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table><div class="empty" id="empty" hidden>검색 결과가 없어요</div></div>
  <button class="btn ghost more" id="more" hidden>더 보기</button>
  <div class="local" id="local">
    🔒 <b>출고가·공급가</b>는 사이트에 올라가 있지 않아요. 이 기기에서만 보려면
    <label>내부 단가 CSV 불러오기<input type="file" id="file" accept=".csv,text/csv" hidden></label>
    (코드·판매가·출고가·공급가 열이 있는 acebed_price_list.csv). 이 브라우저에만 저장돼요.
    <span id="localState"></span>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const won=n=>n?n.toLocaleString("ko-KR"):"–";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CATS=[],ITEMS=[],PRIV=null,view=[],shown=0,sortK=2,sortDir=1;
const PAGE=100;

/* 내부 단가(출고가·공급가)는 IndexedDB에만 보관 */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("linus-price",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbGet(k){try{const db=await idb();return await new Promise(ok=>{const r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch{return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise(ok=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=ok})}catch{}}
async function idbDel(k){try{const db=await idb();await new Promise(ok=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=ok;t.onerror=ok})}catch{}}

function splitCSV(line){const o=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch=='"'){if(q&&line[i+1]=='"'){c+='"';i++}else q=!q}else if(ch==","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
const num=v=>parseInt(String(v||"").replace(/[^\d]/g,""),10)||0;

async function onFile(f){
  let t=new TextDecoder("utf-8").decode(await f.arrayBuffer());
  t=t.replace(/^﻿/,"");
  const lines=t.split(/\r?\n/).filter(Boolean),h=splitCSV(lines[0]).map(s=>s.trim());
  const ix={code:h.indexOf("코드"),out:h.indexOf("출고가"),sup:h.indexOf("공급가")};
  if(ix.code<0||ix.out<0||ix.sup<0){alert("코드·출고가·공급가 열을 찾지 못했어요");return}
  const m={};for(const l of lines.slice(1)){const r=splitCSV(l);m[r[ix.code]]=[num(r[ix.out]),num(r[ix.sup])]}
  PRIV=m;await idbSet("priv",m);applyPriv();
}
function applyPriv(){
  document.body.classList.toggle("has-priv",!!PRIV);
  $("#localState").innerHTML=PRIV?` · ✅ 내부 단가 ${Object.keys(PRIV).length.toLocaleString()}개 표시 중 <a href="#" id="clr" style="color:var(--accent)">이 기기에서 지우기</a>`:"";
  if(PRIV)$("#clr").onclick=async e=>{e.preventDefault();if(!confirm("이 기기에 저장된 출고가·공급가를 지울까요?"))return;PRIV=null;await idbDel("priv");applyPriv()};
  run();
}

function run(){
  const q=$("#q").value.trim().toLowerCase(),c=$("#cat").value;
  const terms=q.split(/\s+/).filter(Boolean);
  view=ITEMS.filter(x=>(c===""||x[1]==+c)&&terms.every(t=>x[4].includes(t)));
  const val=(x,k)=>k<4?x[k]:(PRIV&&PRIV[x[0]]?PRIV[x[0]][k-4]:0);
  view.sort((a,b)=>{const A=val(a,sortK),B=val(b,sortK);return (typeof A=="number"?A-B:String(A).localeCompare(String(B),"ko"))*sortDir});
  shown=0;$("#tb").innerHTML="";more();
  $("#count").textContent=`${view.length.toLocaleString()}개 제품`;
  $("#empty").hidden=view.length>0;
}
function more(){
  const part=view.slice(shown,shown+PAGE);shown+=part.length;
  $("#tb").insertAdjacentHTML("beforeend",part.map(x=>{const p=PRIV&&PRIV[x[0]];return `<tr><td class="code">${esc(x[0])}</td><td><span class="cat">${esc(CATS[x[1]])}</span><br>${esc(x[2])}</td><td class="n"><b>${won(x[3])}</b></td><td class="n priv">${won(p&&p[0])}</td><td class="n priv">${won(p&&p[1])}</td></tr>`}).join(""));
  $("#more").hidden=shown>=view.length;
  $("#more").textContent=`더 보기 (${(view.length-shown).toLocaleString()}개 남음)`;
}
let tm;$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(run,150)};
$("#cat").onchange=run;$("#more").onclick=more;
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)onFile(f)};
document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=+th.dataset.k;sortDir=sortK===k?-sortDir:(k>=3?-1:1);sortK=k;run()});

(async()=>{
  try{
    const d=await (await fetch("prices.json",{cache:"no-cache"})).json();
    CATS=d.cats;ITEMS=d.items.map(x=>[x[0],x[1],x[2],x[3],(x[0]+" "+x[2]+" "+d.cats[x[1]]).toLowerCase()]);
    $("#meta").textContent=`에이스침대 제품 판매가 · ${ITEMS.length.toLocaleString()}개 · 기준일 ${d.updated}`;
    $("#cat").insertAdjacentHTML("beforeend",CATS.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join(""));
  }catch(e){$("#meta").textContent="가격표를 불러오지 못했어요";}
  PRIV=await idbGet("priv")||null;applyPriv();
})();
</script>
</body>
</html>
