<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리노 워크스페이스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#120d1c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리노WS">
<style>
:root{color-scheme:dark;--g:#ff8a5c;--g-soft:rgba(255,255,255,.18);--bg:#120d1c;--card:rgba(255,255,255,.1);--tx:#fff;--mut:rgba(255,255,255,.68);--line:rgba(255,255,255,.2);
--idea:#d9a62e;--make:#4f86d6;--review:#a06ad0;--ready:#e08a3c;--done:#4aa56a;--serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;--glass:rgba(22,15,38,.4);--glass-b:rgba(255,255,255,.26);--side:230px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:18px}
.crumb{flex:1;color:var(--mut)}.crumb b{color:var(--tx)}
.sync{font-size:12px;color:var(--g)}
main{padding:16px 16px 80px;max-width:760px;margin:auto}
h1{margin:4px 0 2px;font-size:24px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mut)}.stat b{display:block;font-size:clamp(17px,5.2vw,26px);overflow-wrap:anywhere}
.stat.hl{background:var(--g);color:#fff;border-color:var(--g)}.stat.hl small{color:#d8f0e3}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card .body{padding:0 14px 12px}
.empty{color:var(--mut);padding:10px 0;font-size:13px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.item .t{font-weight:600}.item .m{color:var(--mut);font-size:12px}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:#fff;cursor:pointer}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:3px;margin:12px 0;overflow:auto}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--g);font-weight:700}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.form{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
#drawer{position:fixed;inset:0;display:none;z-index:10}#drawer.open{display:flex}
#drawer nav{width:290px;max-width:82%;background:var(--card);padding:18px 14px;overflow:auto}
#drawer .shade{flex:1;background:#0006}
.logo{font-size:24px;font-weight:800}.logo i{color:var(--g)}
.brandbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.navbtn{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:12px;cursor:pointer;margin:2px 0}
.navbtn.on{background:var(--g-soft);color:var(--g);font-weight:700}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px}.done{text-decoration:line-through;color:var(--mut)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.low{color:#c0392b;font-weight:700}
body.staff .del{display:none}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.8;word-break:keep-all}
.doc h3{margin:14px 0 4px;font-size:16px}.doc hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ph{background:rgba(201,154,26,.22);border-radius:6px;padding:0 4px}
.doc code{background:var(--bg);border-radius:5px;padding:0 4px;font-size:.92em}
.doc a{color:var(--g)}
.lock{max-width:380px;margin:40px auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block}.tile small{color:var(--mut);word-break:break-all}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:6;display:none;align-items:center;justify-content:center}
#modal{position:fixed;inset:0;z-index:20;display:none}#modal.open{display:block}
.shade2{position:absolute;inset:0;background:#0006}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px;max-height:92vh;overflow:auto}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:86%;text-align:center}

/* ── 시네마 글래스 ── */
html{background:#120d1c}
body{background:transparent;color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em}
#bgph{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,#1c1233,#0a0714)}
#bgph .bgimg{position:absolute;inset:-28px;background-size:cover;background-position:center;transition:opacity .5s,filter .3s}
#bgph .bgimg svg{width:100%;height:100%;display:block}
#bgph .bgdim{position:absolute;inset:0;transition:background .3s}
#bgph .bgdim:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,24,.35),rgba(10,6,24,0) 30%,rgba(10,6,24,.5))}
main{position:relative;z-index:1}#fab{z-index:6}
h1,.card h3,.logo,.mast,.sheet b,.doc h3{font-family:var(--serif)}
.glass,header,.card,.form,.doc,.tile,.sheet,.lock,.brandbox,#drawer nav,#tabbar,.stat,.tabs{background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
header{position:sticky;top:0;z-index:5;border:0;border-bottom:1px solid var(--glass-b);padding:10px 16px;border-radius:0}
.mast{font-size:21px;font-weight:900;margin-right:10px;letter-spacing:-.03em}.mast i,.logo i{color:var(--g);font-style:normal}
.crumb{display:flex;align-items:baseline;color:var(--mut);font-size:13px;letter-spacing:.08em}.crumb b{color:var(--tx);font-weight:600}
.sync{color:#9be3b6}
.icon{background:var(--glass);border:1px solid var(--glass-b);color:var(--tx);border-radius:50%}
main{padding:20px 16px 130px;max-width:1100px;margin:0 auto}
h1{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.2;margin:6px 0 4px}
.sub,.m.sub{color:var(--mut)}
.mono{font:600 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
.btn{background:#fff;color:#1a1020;border-radius:999px;padding:11px 20px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.5)}
.card{border-radius:24px;margin:16px 0;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.03em}
.stats{gap:10px}.stat{border-radius:18px;padding:12px 14px}.stat small{color:var(--mut);letter-spacing:.08em}.stat b{font-family:var(--serif);font-weight:900;letter-spacing:-.04em}
.stat.hl{background:rgba(255,255,255,.92);color:#1a1020;border-color:#fff}.stat.hl small{color:#5b5470}
.item{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;margin:0}
.item:last-child{border-bottom:0}
.pill{border-radius:999px;padding:4px 11px}
.stchips span,.li .st{background:rgba(255,255,255,.06)}
.tabs{border-radius:999px;padding:4px;gap:2px}.tabs button{border-radius:999px;color:var(--mut)}.tabs button.on{background:#fff;color:#1a1020}
input,select,textarea{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.26);border-radius:12px;color:#fff}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.5)}
input:focus,select:focus,textarea:focus{outline:0;border-color:#fff}
select option{color:#111;background:#fff}input[type=date]{color-scheme:dark}
.form{border-radius:20px}
.tile{border-radius:18px;transition:transform .15s}.tile:hover{transform:translateY(-2px)}.tile small{color:var(--mut)}
.brandbox{border-radius:16px}
#drawer .shade{background:#0008}
#drawer nav{border-radius:0 24px 24px 0;background:rgba(24,16,40,.78)}
.navbtn{color:var(--tx);border-radius:14px;padding:9px 12px}
#drawer .brandbox{margin:8px 0;padding:8px 12px}#drawer .sub{margin-bottom:6px}.navbtn.on{background:#fff;color:#1a1020;font-weight:700}
.chips button{background:var(--glass);border:1px solid var(--glass-b);color:var(--tx);border-radius:999px}
.sheet{background:rgba(24,16,40,.9);border-radius:24px 24px 0 0;border-bottom:0}
.shade2{background:#0008}
.doc{border-radius:20px;font-size:15.5px}.doc a{color:#ffb08f}.doc code{background:rgba(255,255,255,.14)}
.low{color:#ff8f80}
#toast{background:rgba(24,16,40,.92);border:1px solid var(--glass-b);color:#fff;border-radius:14px}
.lock{border-radius:24px;padding:22px}
.qty button{background:var(--glass);border:1px solid var(--glass-b);color:var(--tx)}
.fab{background:#fff;color:#1a1020;border:0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.chk input,input[type=range],input[type=checkbox]{accent-color:#fff}
.chk{border-color:var(--line)}
/* 홈 */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:8px 4px 6px}
.hero h1{font-size:clamp(34px,7.4vw,84px);line-height:.98;letter-spacing:-.05em;margin:8px 0 8px}
.hero .kpi{display:flex;gap:24px;text-align:right}.hero .kpi b{display:block;font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:-.04em;line-height:1}
.homegrid{display:grid;grid-template-columns:1.6fr 1fr;gap:0 16px;align-items:start}
.hg-list{grid-area:list}.hg-quick{grid-area:quick}.hg-rest{grid-area:rest}
.homegrid{grid-template-areas:"list quick" "list rest";grid-template-rows:auto 1fr}
.li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-of-type{border-bottom:0}
.li b{font-size:clamp(16px,1.8vw,21px);letter-spacing:-.03em;font-weight:800;overflow-wrap:anywhere}
.li .st{font:700 10px ui-monospace,Menlo,monospace;border:1.4px solid rgba(255,255,255,.7);border-radius:999px;padding:3px 9px;white-space:nowrap}
.li.hot{background:#fff;color:#1a1020;border-radius:14px;padding:11px 12px;margin:2px -4px;border-bottom:0}
.li.hot .st{border-color:#1a1020}.li.hot .mono{color:#1a1020}
.stchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.stchips span{font-size:12px;border:1px solid var(--glass-b);border-radius:999px;padding:3px 10px;color:var(--mut)}
/* 배경 설정 */
.bgthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:10px 0}
.bgt{height:64px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;color:#fff;font-size:11px;text-align:left;padding:6px;cursor:pointer;position:relative;display:flex;align-items:flex-end;text-shadow:0 1px 4px #000}
.bgt.on{border-color:#fff}.bgt i{position:absolute;right:4px;top:4px;font-style:normal;background:#000a;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;text-shadow:none}
.bgt.auto{background:var(--glass);border-color:var(--glass-b);text-shadow:none;align-items:center;justify-content:center;text-align:center}
.rng{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.rng input{padding:0}
/* 지시 채팅 */
.chatgrid{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.chatlist{border-radius:20px;padding:10px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:70px}
.chatsel-wrap{display:none;margin-bottom:10px}
.chathead{border-radius:16px;padding:10px 14px;margin-bottom:10px}
.chatlog{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 420px);min-height:220px;overflow:auto;padding:4px 2px 10px}
.bubble{border-radius:18px;padding:11px 14px;max-width:88%}
.bubble.me{align-self:flex-end;background:#fff;color:#1a1020;border-bottom-right-radius:5px}
.bubble.me .t{font-weight:700}.bubble.me .m{color:#5b5470}
.bubble.sys{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-b);border-bottom-left-radius:5px}
.composer{border-radius:20px;padding:12px;display:grid;gap:8px;margin-top:6px}
@media(max-width:899px){.chatgrid{grid-template-columns:1fr}.chatlist{display:none}.chatsel-wrap{display:block}.chatlog{max-height:46vh;min-height:160px}.bubble{max-width:96%}}
/* 하단 탭 (모바일) */
#tabbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;border-radius:24px;padding:8px 4px;justify-content:space-around;background:rgba(22,15,38,.62)}
#tabbar button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:4px 0;cursor:pointer;border-radius:16px}
#tabbar button span{font-size:20px;line-height:1}#tabbar button.on{color:#fff;font-weight:700}
@media(max-width:899px){
 #menu{display:none}#tabbar{display:flex}body.out #tabbar{display:none}
 #drawer{z-index:12}
 .fab{bottom:calc(92px + env(safe-area-inset-bottom));right:16px;width:52px;height:52px;font-size:28px}
 .homegrid{grid-template-columns:1fr;grid-template-areas:"quick" "list" "rest";grid-template-rows:auto}
 .hero .kpi{display:none}
 .li{grid-template-columns:26px 1fr auto}.li .cty{display:none}
}
@media(min-width:900px){
 #menu{display:none}
 body:not(.out) #drawer{display:flex;position:fixed;inset:20px auto 20px 20px;width:var(--side);z-index:8}
 body:not(.out) #drawer nav{width:100%;max-width:none;border-radius:24px;border:1px solid var(--glass-b)}
 body:not(.out) #drawer .shade{display:none}
 body:not(.out) header,body:not(.out) main{margin-left:calc(var(--side) + 40px)}
 body:not(.out) main{max-width:none;margin-right:28px}
 body.out #drawer{display:none}
 .fab{right:28px;bottom:28px;display:flex}
}
body.out main{max-width:760px}
.fab.chat{font-size:26px;background:var(--make);color:#fff;border:2px solid #fff}
.fab.chat i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff5a4d;color:#fff;font:700 11px/20px -apple-system,sans-serif;font-style:normal;text-align:center;padding:0 5px}
.fab.chat i:empty{display:none}
@media(max-width:899px){.fab.chat{bottom:calc(92px + 62px + env(safe-area-inset-bottom));right:16px;width:52px;height:52px}}
@media(min-width:900px){.fab.chat{right:28px;bottom:100px}}
.quickcard textarea{min-height:64px}
</style>
</head>
<body>
<div id="bgph"><div class="bgimg"></div><div class="bgdim"></div></div>
<header>
  <button class="icon" id="menu" aria-label="메뉴">☰</button>
  <div class="crumb"><span class="mast">Rino<i>.</i></span><b id="crumb"></b></div>
  <span class="sync" id="sync">● 자동 저장</span>
</header>
<div id="drawer"><nav>
  <div class="logo">Rino<i>.</i></div>
  <div class="sub">AI 기반 자동 수익 시스템</div>
  <div class="brandbox"><b>리노 퍼스널 브랜드</b><div class="m sub" style="margin:0">여행 · 가구 · 스트릿포토</div></div>
  <div id="who"></div>
  <div id="navlist"></div>
</nav><div class="shade"></div></div>
<main id="app"></main>
<button class="fab" id="fab" aria-label="업무 추가" onclick="openTaskModal()">＋</button>
<button class="fab chat" id="chatfab" aria-label="직원에게 지시" onclick="go('chat')">💬<i id="chatbadge"></i></button>
<nav id="tabbar" aria-label="하단 메뉴"></nav>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
const CH={blog:"세계여행 블로그",furn:"가구 브랜드",photo:"스트릿포토 인스타"};
const ST=[["idea","아이디어","--idea"],["make","제작중","--make"],["review","검수","--review"],["ready","발행예정","--ready"],["done","발행완료","--done"]];
const PAGES=[["home","🏠","홈"],["contents","🗂️","전체 콘텐츠"],["tasks","✅","업무 관리"],["chat","💬","지시 채팅",1],["calendar","📅","콘텐츠 캘린더"],["org","🏛️","조직도"],["sop","📖","나만의 SOP"],["routine","🌿","오늘 루틴"],["revenue","💰","수익 대시보드",1],["staff","👥","직원 관리",1],["doc","📄","초안 보기",0,1],["settings","⚙️","설정",1]];
const RCH={...CH,etc:"기타"};
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seed=()=>({updated:0,del:{},set:{staff:[],agents:[],brands:[],links:[],stage:1,pins:null,goal:1000000,u:0},revenue:[],contents:[],tasks:[],stock:[],sop:[
  {id:uid(),title:"블로그 발행 SOP",steps:["키워드 선정","초안 작성","사진 선별·보정","SEO 점검","발행 후 인스타 공유"]},
  {id:uid(),title:"인스타 릴스 SOP",steps:["후킹 문장 정하기","영상 컷 편집","자막·BGM","캡션·해시태그","예약 발행"]}],
  routine:{date:today(),items:[["아침 스트레칭",0],["콘텐츠 1개 진행",0],["댓글·DM 확인",0],["수익 지표 체크",0],["내일 할 일 3개 적기",0]]}});

/* 저장할 때 바뀐 항목에만 수정시각(u)을 찍고, 지운 항목은 삭제기록(del)에 남겨요 */
function stamp(){
  const now=Date.now(),seen={};
  LISTS.forEach(l=>D[l].forEach(it=>{seen[it.id]=1;const{u,...r}=it,h=JSON.stringify(r);if(SNAP[it.id]!==h){it.u=now;SNAP[it.id]=h}}));
  Object.keys(SNAP).forEach(id=>{if(!seen[id]){D.del[id]=now;delete SNAP[id]}});
}
/* 두 기기의 데이터를 항목 단위로 합쳐요 (같은 항목이면 나중에 고친 쪽 우선) */
function merge(a,b){
  const o={...(b.updated>a.updated?b:a)};
  o.updated=Math.max(a.updated||0,b.updated||0);
  o.del={...b.del};Object.entries(a.del).forEach(([k,v])=>{o.del[k]=Math.max(v,o.del[k]||0)});
  LISTS.forEach(l=>{
    const m=new Map();
    [...b[l],...a[l]].forEach(it=>{const c=m.get(it.id);if(!c||(it.u||0)>=(c.u||0))m.set(it.id,it)});
    o[l]=[...m.values()].filter(it=>!((o.del[it.id]||0)>=(it.u||0)&&o.del[it.id]));
    const order=new Map(a[l].map((x,i)=>[x.id,i]));
    o[l].sort((x,y)=>(order.has(x.id)?order.get(x.id):-1)-(order.has(y.id)?order.get(y.id):-1)||0);
  });
  o.set=(b.set.u||0)>(a.set.u||0)?b.set:a.set;
  if(a.routine.date===b.routine.date){o.routine={date:a.routine.date,items:a.routine.items.map((x,i)=>[x[0],(x[1]||(b.routine.items[i]&&b.routine.items[i][1]))?1:0])}}
  else o.routine=a.routine.date>b.routine.date?a.routine:b.routine;
  return o;
}

const probe=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>ok({im,u});im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("이 형식은 열 수 없어요 (JPG·PNG·WebP를 올려 주세요)"))};im.src=u});
async function viewCopy(f){

    const k=4096/Math.max(w,h),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
    const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,0,0,c.width,c.height);

  finally{URL.revokeObjectURL(u)}
}

/* ---------- 수익 대시보드 ---------- */
const monthKey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
views.revenue=()=>{
  const now=new Date(),cur=monthKey(now.getFullYear(),now.getMonth());
  const sum=a=>a.reduce((s,r)=>s+r.amount,0);
  const month=D.revenue.filter(r=>r.date.startsWith(cur)),total=sum(month);
  const pct=D.set.goal>0?Math.min(100,Math.round(total/D.set.goal*100)):0;
  const months=[...Array(6)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);const k=monthKey(d.getFullYear(),d.getMonth());return[k.slice(5)+"월",sum(D.revenue.filter(r=>r.date.startsWith(k)))]});
  const mx=Math.max(1,...months.map(m=>m[1]));
  const recent=[...D.revenue].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  return `<h1>수익 대시보드</h1><div class="sub">${cur} · 숫자를 기록하면 흐름이 보여요</div>
  <div class="stats">${stat("이번 달 수익",won(total),1)}${stat("목표 달성률",pct+"%")}${stat("남은 금액",won(Math.max(0,D.set.goal-total)))}</div>
  <div class="card"><div class="body" style="padding-top:12px"><div class="m sub">월 목표 (원)</div><input type="number" min="0" value="${D.set.goal}" onchange="D.set.goal=+this.value||0;D.set.u=Date.now();save();render()">

  <div class="card"><h3>최근 6개월</h3><div class="body"><div style="display:flex;gap:8px;align-items:flex-end;height:120px">${months.map(([n,v])=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(v/mx*90)}px;background:var(--g);border-radius:6px 6px 0 0;min-height:2px"></div><div class="m">${n}</div></div>`).join("")}</div></div></div>

  ${recent.map(r=>`<div class="item"><div class="row"><div class="grow"><div class="t">${won(r.amount)}</div><div class="m">${esc(r.date)} · ${RCH[r.ch]||"기타"}${r.memo?" · "+esc(r.memo):""}</div></div><button class="icon del" style="width:32px;height:32px" onclick="delItem('revenue','${r.id}')">✕</button></div></div>`).join("")||'<div class="empty">아직 기록이 없어요</div>'}`;

function cmdText(x,imm){

    if(x.memo)L.push("- 내용: "+x.memo);

let docId="",docTab="body";
function openDoc(id){docId=id;docTab="body";go("doc")}
function md(src){
  return String(src||"").split("\n").map(l=>{
    if(/^\s*-{3,}\s*$/.test(l))return "<hr>";
    if(/^[|\s:-]+$/.test(l)&&l.includes("|"))return "";
    let t=l.startsWith("|")?l.split("|").slice(1,-1).map(c=>c.trim()).join(" — "):l;
    let head=/^#{1,3}\s+/.test(t);if(head)t=t.replace(/^#{1,3}\s+/,"");
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,(m,x)=>/확인 필요|직접 채워/.test(x)?'<span class="ph">'+x+'</span>':'<code>'+x+'</code>');
    t=t.replace(/\[확인 필요[^\]]*\]/g,(m,off,str)=>str.charAt(off-1)===">"?m:'<span class="ph">'+m+'</span>');
    t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
    t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return head?`<h3>${t}</h3>`:(t.trim()===""?"<br>":t+"<br>");
  }).join("");
}

      const ex=D.contents.find(c=>c.title===o.title&&c.by===o.by);
      if(ex)Object.assign(ex,o);else D.contents.unshift({id:uid(),...o});
      n++;
    });
    save();render();alert(n+"건을 가져왔어요. 전체 콘텐츠에서 확인하세요.");
  }catch{alert("콘텐츠 파일이 아니에요")}});
}

/* ---------- SOLAMEN 작업 폴더 불러오기 (읽기 전용 토큰, 관리자 기기에만 저장) ---------- */
/* 직원들이 SOLAMEN 레포의 작업 폴더(작업/날짜_[태그]_제목/)에 저장한 글을 읽어 전체 콘텐츠에 넣어요.
   클라우드 직원 세션은 Gist 같은 계정 API를 쓸 수 없어서, 이미 하던 대로 레포에 저장하게 두고 앱이 읽어 와요. */
const PARSER_V="p2";
const WORK_RE=/^작업\/([^/]+)\/(brief|plan|draft|final|copyedit)\.md$/;
const REPO_CH={트립:"blog",슬립:"furn",포토:"photo",공통:"blog"};
const repoOk=r=>/^[\w.-]+\/[\w.-]+$/.test(r||"");
const ghRepo=path=>fetch("https://api.github.com"+path,{headers:{Authorization:"Bearer "+CFG.repoToken,Accept:"application/vnd.github+json"}});
function b64text(b64){const bin=atob(String(b64).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u)}
function splitDraft(text){
  const sec=re=>{const m=text.match(new RegExp("^##\\s+"+re+"[^\\n]*\\n","m"));if(!m)return null;const s0=m.index+m[0].length;const n=text.slice(s0).search(/^##\s+/m);const end=n<0?text.length:s0+n;return{start:m.index,end,body:text.slice(s0,end).replace(/^\n+|\n+$/g,"")}};
  const b=sec("본문");if(!b)return{title:"",body:text.trim(),report:""};
  let body=b.body.replace(/(\n\s*-{3,}\s*)+$/,"").trim();const cuts=[[b.start,b.end]];
  const t=sec("해시태그");if(t){body+="\n\n---\n\n"+t.body.trim();cuts.push([t.start,t.end])}
  body=body.replace(/(\n\s*-{3,}\s*)+$/,"").trim();
  let rest=text;cuts.sort((x,y)=>y[0]-x[0]).forEach(([a,z])=>{rest=rest.slice(0,a)+rest.slice(z)});
  let title="";const ts=sec("제목");
  if(ts){const bold=ts.body.match(/^\*\*([^*\n]+)\*\*\s*$/m);if(bold)title=bold[1].trim();else{const li=ts.body.match(/^\s*1\.\s*(.+)$/m);if(li)title=li[1].replace(/\*\*/g,"").split(" — ")[0].trim()}}
  return{title,body,report:rest.trim()};
}
function stageOf(f,head){
  if(f.final||/최종 승인[^\n:]*:\s*완료/.test(head))return"ready";
  if(f.copyedit||/교열[^\n:]*:\s*완료/.test(head))return"review";
  return(f.draft||f.plan)?"make":"idea";
}
async function importRepo(silent){
  if(!isAdmin())return;
  const say=m=>{if(!silent)alert(m)};
  const repo=(CFG.repo||"").trim(),br=(CFG.repoBranch||"work").trim();
  if(!CFG.repoToken||!repoOk(repo)){say("저장소 이름과 읽기 전용 토큰을 먼저 입력해 주세요");return}
  const back=$("#sync")?$("#sync").textContent:"";setSync("📂 작업 폴더 확인 중…");
  try{
    const r=await ghRepo(`/repos/${repo}/git/trees/${encodeURIComponent(br)}?recursive=1`);
    if(r.status===401){say("토큰이 올바르지 않거나 만료됐어요");return}
    if(r.status===403){say("이 토큰으로는 읽을 수 없어요. 토큰의 저장소 선택과 Contents 읽기 권한을 확인해 주세요");return}
    if(r.status===404){say("저장소나 브랜치를 찾지 못했어요. 이름과 토큰의 저장소 선택을 확인해 주세요");return}
    if(!r.ok)throw new Error(r.status);
    const tree=await r.json(),folders={};
    (tree.tree||[]).forEach(e=>{if(e.type!=="blob")return;const m=WORK_RE.exec(e.path);if(m)(folders[m[1]]=folders[m[1]]||{})[m[2]]=e.sha});
    const names=Object.keys(folders).filter(n=>{const f=folders[n];return f.draft||f.final||f.plan||f.brief}).sort().reverse().slice(0,60);
    const cut=(v,m)=>String(v||"").slice(0,m);let added=0,updated=0;
    for(const name of names){
      const f=folders[name],sig=PARSER_V+"|"+Object.keys(f).sort().map(k=>k+":"+f[k]).join("|");
      const ex=D.contents.find(c=>c.src===name);
      if(ex&&ex.srcSig===sig)continue;
      const blob=async k=>{const x=await ghRepo(`/repos/${repo}/git/blobs/${f[k]}`);if(!x.ok)throw new Error(x.status);return b64text((await x.json()).content)};
      const text=await blob(f.final?"final":f.draft?"draft":f.plan?"plan":"brief"),sp=splitDraft(text);
      let report=sp.report;
      if(f.copyedit){const ce=await blob("copyedit");report=(report?report+"\n\n---\n\n":"")+"## 교열·사실 확인 결과 (copyedit.md)\n\n"+ce.replace(/^#\s+교열[^\n]*\n/,"")}
      const head=text.slice(0,3000),stage=stageOf(f,head),bm=/\[([^\]]+)\]/.exec(name),brand=bm?bm[1]:"";
      const title=cut(sp.title||name.replace(/^\d{4}-\d\d-\d\d_/,"").replace(/\[[^\]]+\]_?/,"").replace(/_/g," "),200);
      const am=/^-\s*작성:\s*([^\s(·]+)/m.exec(head),by=cut(am?am[1]:"SOLAMEN",40);
      const memo=cut(`SOLAMEN 작업 폴더 ${name} · ${stInfo(stage)[1]}(파일로 추정)`,300);
      if(ex){
        if(ex.title===ex.srcTitle)ex.title=title;
        if(ex.stage===ex.srcStage)ex.stage=stage;
        Object.assign(ex,{body:cut(sp.body,100000),report:cut(report,100000),memo,brand,srcSig:sig,srcStage:stage,srcTitle:title});updated++;
      }else{
        D.contents.unshift({id:uid(),title,ch:REPO_CH[brand]||"blog",stage,due:"",memo,by,body:cut(sp.body,100000),report:cut(report,100000),brand,src:name,srcSig:sig,srcStage:stage,srcTitle:title});added++;
      }
    }
    CFG.repoLast=Date.now();saveCfg();
    if(added||updated){save();render()}
    say(added||updated?`새 글 ${added}건, 갱신 ${updated}건을 불러왔어요`:"새로 바뀐 글이 없어요 (이미 최신이에요)");
    setSync(back&&!back.startsWith("📂")?back:(CFG.token?"☁ 동기화됨":"● 자동 저장"));
  }catch(e){setSync("⚠ 불러오기 실패");say("불러오지 못했어요. 인터넷 연결과 토큰을 확인해 주세요")}
}
function saveRepo(){
  if(!isAdmin())return;
  const repo=$("#wr").value.trim(),br=$("#wb").value.trim()||"work",tk=$("#wt").value.trim();
  if(!repoOk(repo)){alert("저장소는 '주인/이름' 형태로 입력해 주세요 (예: linus707/solamen)");return}
  if(!tk){alert("읽기 전용 토큰을 입력해 주세요");return}
  if(/^ghp_/.test(tk)&&!confirm("이 토큰(ghp_…)은 권한이 넓을 수 있어요. 가능하면 SOLAMEN 레포 하나만, 읽기 전용(Contents: Read-only)으로 만든 토큰(github_pat_…)을 쓰세요. 그래도 계속할까요?"))return;
  CFG.repo=repo;CFG.repoBranch=br;CFG.repoToken=tk;CFG.repoAuto=$("#wa").checked?1:0;saveCfg();importRepo(false);
}
function clearRepo(){if(!confirm("이 기기에 저장된 읽기 전용 토큰을 지울까요? (불러온 글은 그대로 남아요)"))return;delete CFG.repoToken;CFG.repoAuto=0;saveCfg();render()}

/* ---------- 로그인·권한 (PIN) ---------- */
/* ※ 서버가 없는 방식이라 PIN은 화면 접근을 막는 '편의용 잠금'이에요. 민감한 개인정보는 넣지 마세요. */
const ME_KEY="rino-me";
let ME=null;
try{ME=JSON.parse(sessionStorage.getItem(ME_KEY)||localStorage.getItem(ME_KEY)||"null")}catch{}
async function hashPin(pin,salt){
  const t=salt+":"+pin;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch{let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return"w"+h}
}
function me(){
  const p=D.set.pins;
  if(!p)return CFG.invited?null:{role:"admin",name:"관리자",open:true};
  if(ME&&ME.h===(ME.role==="admin"?p.a:p.s))return ME;
  return null;
}
const isAdmin=()=>{const m=me();return !!m&&m.role==="admin"};
const curName=()=>{const m=me();return m?m.name:""};
async function login(){
  const role=$("#lr").value,name=role==="admin"?"관리자":$("#ln").value.trim(),pin=$("#lp").value.trim(),p=D.set.pins;
  if(!p)return;
  if(!name){alert("이름을 입력해 주세요");return}
  const h=await hashPin(pin,p.salt);
  if(h!==(role==="admin"?p.a:p.s)){alert("PIN이 맞지 않아요");$("#lp").value="";return}
  ME={role,name,h};
  const store=$("#lk").checked?localStorage:sessionStorage;
  try{localStorage.removeItem(ME_KEY);sessionStorage.removeItem(ME_KEY);store.setItem(ME_KEY,JSON.stringify(ME))}catch{}
  page="home";render();
}
function logout(){ME=null;try{localStorage.removeItem(ME_KEY);sessionStorage.removeItem(ME_KEY)}catch{}$("#drawer").classList.remove("open");render()}

  <button class="btn" onclick="login()">로그인</button></div></div>`;
};

function chatSet(n){chatDraft=($("#cmsg")||{value:chatDraft}).value;chatWho=n;render()}
function chatDueSet(n){chatDue=addDays(n);const e=$("#cdue");if(e)e.value=chatDue}
function dispatchTask(name,txt,due,brand,mode){
  const lines=txt.split("\n"),title=lines[0].trim().slice(0,200),memo=lines.slice(1).join("\n").trim().slice(0,1500);
  const x={id:uid(),title,due:due||"",pri:"중요도 보통",done:0,who:name,memo,brand:brand||"",by:curName(),as:"sent",at:Date.now()};
  D.tasks.unshift(x);save();
  const out=cmdText(x,mode);
  const ok=()=>toast(mode===2?"복사했어요. 이 채팅(Claude)에 붙여넣으면 "+name+" 한 명만 깨워요":"복사했어요. Slack에 붙여넣어 올려 주세요");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(out).then(ok,()=>prompt("복사해서 보내 주세요",out));else prompt("복사해서 보내 주세요",out);
}
function sendChat(){
  const txt=($("#cmsg").value||"").trim();if(!txt){alert("지시 내용을 써 주세요");return}
  const cur=chatPick();if(!cur)return;
  dispatchTask(cur.name,txt,$("#cdue").value||"",$("#cbr")?$("#cbr").value:"",+($("#cmode").value||1));
  chatDraft="";chatDue="";render();
  const log=$("#chatlog");if(log)log.scrollTop=log.scrollHeight;
}

/* ---------- AI 초안 쓰기 ---------- */
const GREETING="안녕하세요.\n낯선 거리를 카메라로 맛보는 여행자,\n한 장의 사진에 도시의 온도를 담고 싶은\n얼뚱트립의 리노입니다. 📷";
const DRAFT_MODEL="claude-sonnet-5-5";
const DRAFT_RULES=`너는 30대 1인 퍼스널 브랜더 "리노"(여행작가·수면큐레이터·스트릿 포토그래퍼)의 네이버 블로그 글 초고를 쓰는 작가다. 독자는 초보자이고, 실용적이고 공감되며 구조가 분명한 글을 쓴다.

[글 구조 — 이 순서]
1) 후킹 문구 3줄: 첫 줄은 "❝ *…*", 둘째 줄은 "*…*", 셋째 줄은 "*… ❞*" 형태 (각 줄 기울임)
2) 도입 2~3문장
3) 경험 문단: 사용자가 준 "내 경험"이 있으면 그 내용만 써서 1~2문단. 없으면 정확히 이 한 줄만 쓴다: [확인 필요 · 직접 채워 주세요] 직접 겪은 경험 2~3문장
4) 이모지 소제목 3~4개: **🏨 1. 독자가 검색할 만한 질문형 소제목** 형식. 소제목 바로 아래 2~3문장에 핵심 답을 먼저 쓴다.
5) 저장해 두고 싶은 실용 정보 하나 (체크리스트 또는 비교 정리)
6) 📷 리노's Pick — 한 줄 요약과 2~3줄 마무리
7) 키워드 지정형 댓글 유도: 댓글에 '키워드'를 남기면 답해 주겠다는 문장 (키워드는 주제에 맞게)
8) 내부 링크 자리 한 줄: [확인 필요: 관련 포스팅 3개 제목과 URL]
9) 맨 마지막 줄: 해시태그 12~15개를 한 줄로 (#으로 시작, 공백으로 구분)

[사실 규칙 — 가장 중요]
- 가격, 요금, 운임, 영업시간, 입장료, 소요시간, 환율, 교통편, 호텔·가게·상품 이름, 통계, 날짜 같은 검증이 필요한 구체 정보는 쓰지 마라. 꼭 필요하면 숫자 대신 [확인 필요: 무엇을 확인할지] 로 표시한다.
- 직접 겪은 일을 지어내지 마라. "다녀왔다·묵었다·먹어봤다·써봤다" 같은 표현은 "내 경험"에 있는 내용에만 쓴다.
- 모르면 모른다고 쓰지 말고 [확인 필요: …] 로 남겨라.
- 사진이 필요한 자리는 [📸 사진: 설명] 으로 표시한다.
- 의학적 효능이나 과장 광고 표현은 쓰지 않는다.

[문장 규칙]
해요체를 중심으로 합니다체를 섞고(6:4), 한 문장은 40자 안팎, 문단은 3~4줄, 같은 어미를 3번 연속 쓰지 않는다. 이모지는 소제목과 마무리에만 쓴다. 분량은 공백 제외 1,500자 이상.

[출력]
본문만 마크다운으로 쓴다. 설명, 머리말, 코드블록, 인사 문구("안녕하세요…")는 쓰지 않는다. 인사 문구는 앱이 맨 앞에 붙인다.`;
/* ── 스킬 (SOLAMEN .claude/skills 의 SKILL.md 를 읽어 와 프롬프트에 함께 담아요) ── */
const SK_KEY="rino-skills",SK_OK=n=>/(blog-posting|instagram|studio)$/.test(n),SK_MAX=45000;
const skillsCache=()=>{try{return JSON.parse(localStorage.getItem(SK_KEY))||{items:[]}}catch{return{items:[]}}};
function skillMeta(t){
  const m=/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(t),fm=m?m[1]:"",body=m?t.slice(m[0].length):t;let d="";
  const dm=/^description:\s*(.*)$/m.exec(fm);
  if(dm){d=dm[1].trim();if(/^[>|]/.test(d)){const out=[];for(const l of fm.slice(dm.index+dm[0].length).split(/\r?\n/).slice(1)){if(/^\s+\S/.test(l))out.push(l.trim());else break}d=out.join(" ")}else d=d.replace(/^["']|["']$/g,"")}
  return{desc:d.replace(/\s+/g," ").slice(0,140),body:body.trim()};
}
async function loadSkills(){
  if(!isAdmin())return;
  const repo=(CFG.repo||"").trim(),br=(CFG.repoBranch||"work").trim();
  if(!CFG.repoToken||!repoOk(repo)){alert("먼저 위의 'SOLAMEN 작업 폴더 불러오기'에서 저장소와 읽기 전용 토큰을 저장해 주세요");return}
  setSync("🧩 스킬 읽는 중…");
  try{
    const r=await ghRepo(`/repos/${repo}/git/trees/${encodeURIComponent(br)}?recursive=1`);
    if(!r.ok)throw new Error(r.status===401?"토큰이 올바르지 않거나 만료됐어요":r.status===404?"저장소나 브랜치를 찾지 못했어요":"읽지 못했어요 ("+r.status+")");
    const tree=await r.json(),g={};
    (tree.tree||[]).forEach(e=>{
      if(e.type!=="blob")return;
      const m=/^\.claude\/skills\/([\w-]+)\/(SKILL\.md|references\/[^/]+\.md)$/.exec(e.path);
      if(!m||!SK_OK(m[1]))return;
      const k=g[m[1]]=g[m[1]]||{refs:[]};
      if(m[2]==="SKILL.md")k.main=e.sha;else k.refs.push([m[2].replace("references/",""),e.sha]);
    });
    const blob=async sha=>{const x=await ghRepo(`/repos/${repo}/git/blobs/${sha}`);if(!x.ok)throw new Error(x.status);return b64text((await x.json()).content)};
    const items=[];
    for(const name of Object.keys(g).sort()){
      const k=g[name];if(!k.main)continue;
      const meta=skillMeta(await blob(k.main));let text=meta.body;
      for(const [fn,sha] of k.refs.sort()){if(text.length>=SK_MAX)break;text+=`\n\n[참고 자료: ${fn}]\n`+(await blob(sha))}
      items.push({name,desc:meta.desc,text:text.slice(0,SK_MAX),n:k.refs.length});
    }
    if(!items.length)throw new Error("글쓰기 스킬을 찾지 못했어요 (.claude/skills 폴더 확인)");
    localStorage.setItem(SK_KEY,JSON.stringify({ts:Date.now(),items}));
    toast(items.length+"개 스킬을 불러왔어요");
  }catch(e){alert("스킬을 불러오지 못했어요: "+(e.message||e))}
  finally{setSync("● 자동 저장");render()}
}

  <div class="m sub">SOLAMEN의 <b>.claude/skills</b> 에서 글쓰기 스킬(블로그·인스타그램)을 읽어 와요. 위 작업 폴더의 읽기 전용 토큰을 그대로 써요. 불러오면 <b>📋 프롬프트 복사</b> 창에서 글 쓸 때마다 스킬을 골라 지침을 함께 복사할 수 있어요.</div>

  ${c.items.map(x=>`<div class="item"><div class="t">${esc(x.name)} <span class="m">· ${Math.round(x.text.length/100)/10}천자</span></div><div class="m">${esc(x.desc)}</div></div>`).join("")}

const BASE_TAIL="사실(가격·시간·이름 등)을 모르면 지어내지 말고 [확인 필요: …]로 표시해 줘. 웹 검색이 안 되면 검색이 필요한 단계는 건너뛰고 그 부분을 [확인 필요]로 남겨 줘.";
function promptText(c,sk,extra){
  const topic=`주제(제목): ${c.title}\n채널: ${CH[c.ch]||""}\n메모: ${c.memo||"없음"}\n내 경험: ${c.exp||"없음"}`+(extra?`\n추가 요청: ${extra}`:"");
  if(!sk)return `아래 [작성 규칙]을 지켜서 [주제]로 글 초고를 써 줘. ${BASE_TAIL}\n\n[작성 규칙]\n${DRAFT_RULES}\n\n[주제]\n${topic}`;
  return `아래 [스킬 지침]을 그대로 따라 [주제]로 글을 써 줘. ${BASE_TAIL}\n결과는 스킬이 정한 출력 형식대로 쓰고, 본문(캡션) 전체를 한 번에 보여 줘.\n\n[스킬 지침: ${sk.name}]\n${sk.text}\n\n[주제]\n${topic}`;
}
const PROMPT_OK="프롬프트를 복사했어요.\n\nclaude.ai 새 대화에 붙여넣어 초안을 받은 뒤, 이 항목의 [✏️ 초안 붙여넣기]로 넣어 주세요.";

  <button class="btn" onclick="pmCopy()">📋 복사</button></div>`;

  if(c.body&&!confirm("이미 초안이 있어요. 덮어쓸까요?"))return;
  const d=buildDraft(c,t);c.body=d.body;c.report=d.report;c.aiDraft=1;if(c.stage==="idea")c.stage="make";
  c.memo=(c.memo?c.memo.replace(/\s*·?\s*AI 초안\(미확인\)$/,"")+" · ":"")+"AI 초안(미확인)";
  save();closeModal();openDoc(id);toast("초안으로 저장했어요. 노란 칸과 사실을 확인해 주세요");
}
const aiBusy={};
const aiBtn=c=>(CFG.aiKey||isAdmin())?`<button class="pill" style="background:var(--make);margin-top:6px" ${aiBusy[c.id]?"disabled":""} onclick="aiDraft('${sid(c.id)}')">${aiBusy[c.id]?"✍️ 작성 중…":"✍️ AI 초안 쓰기"}</button>`:"";
function buildDraft(c,txt){
  let t=String(txt||"").trim().replace(/^```[a-z]*\n/i,"").replace(/\n```$/,"").trim();
  t=t.split(GREETING).join("").trim();
  const lines=t.split("\n");while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  let tags="";if(lines.length&&/^#\S/.test(lines[lines.length-1].trim()))tags=lines.pop().trim();
  const post=lines.join("\n").replace(/(\n\s*-{3,}\s*)+$/,"").trim();
  const greet=c.ch==="blog"?GREETING+"\n\n":"";
  const body=(greet+post+(tags?(c.ch==="blog"?"\n\n---\n\n":"\n\n")+tags:"")).slice(0,100000);
  const ph=(body.match(/\[확인 필요[^\]]*\]/g)||[]);
  const report=`[AI 초안] ${c.title}
- 상태: 초고 (AI가 작성, 사실 확인 전, 미발행)
- 작성: AI(Claude) · ${today()} · 웹 검색 없이 작성
- 주의: 가격·시간·이름 같은 사실은 AI가 확인하지 못했어요. 노란 [확인 필요] 표시와 본문의 모든 사실을 직접 확인하세요.
- 경험: ${c.exp?"대표가 적은 경험 메모를 반영했어요":"직접 겪은 경험은 비워 뒀어요 (직접 채워야 해요)"}

## 확인 필요 목록 (${ph.length}곳)
${ph.length?ph.map(x=>"- "+x).join("\n"):"- 표시된 곳이 없어요. 그래도 모든 사실은 직접 확인하세요"}

## 발행 전 체크
- [ ] 직접 겪은 경험 문단 채우기
- [ ] 사진 교체 (직접 찍은 사진)
${c.ch==="blog"?"- [ ] 내부 링크 3개 연결":"- [ ] 해시태그·댓글 키워드 문구 확인"}
- [ ] 가격·시간·이름을 공식 자료로 확인
- [ ] 제휴·협찬이면 광고 표시`;
  return{body,report:report.slice(0,100000)};
}
async function aiDraft(id){
  const c=D.contents.find(x=>x.id===id);if(!c||aiBusy[id])return;
  if(!CFG.aiKey){if(!isAdmin()){alert("이 기기에는 AI 키가 없어요. 관리자에게 문의해 주세요");return}alert("설정에서 AI 키를 먼저 입력해 주세요");return go("settings")}
  if(c.body&&!confirm("이미 초안이 있어요. AI 초안으로 덮어쓸까요?"))return;
  aiBusy[id]=1;if(page!=="doc")render();toast("AI가 초안을 쓰는 중이에요. 1~2분 걸릴 수 있어요");
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),150000);
  try{
    const user=`주제(제목): ${c.title}\n채널: ${CH[c.ch]||""}\n메모: ${c.memo||"없음"}\n내 경험: ${c.exp||"없음"}`;
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ctl.signal,headers:aiHeaders(),
      body:JSON.stringify({model:DRAFT_MODEL,max_tokens:4096,system:DRAFT_RULES,messages:[{role:"user",content:user}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
    const txt=(j.content||[]).map(x=>x.text||"").join("");if(!txt.trim())throw new Error("빈 응답이 왔어요");
    const d=buildDraft(c,txt),cur=D.contents.find(x=>x.id===id);if(!cur)return;
    cur.body=d.body;cur.report=d.report;cur.aiDraft=1;if(cur.stage==="idea")cur.stage="make";
    cur.memo=(cur.memo?cur.memo.replace(/\s*·?\s*AI 초안\(미확인\)$/,"")+" · ":"")+"AI 초안(미확인)";
    save();delete aiBusy[id];openDoc(id);
    toast(j.stop_reason==="max_tokens"?"초안이 길어서 끝이 잘렸을 수 있어요. 확인해 주세요":"초안을 썼어요. 노란 칸과 사실을 확인해 주세요");
  }catch(e){
    delete aiBusy[id];render();
    alert("AI 초안을 쓰지 못했어요: "+(e.name==="AbortError"?"시간이 너무 오래 걸렸어요. 다시 시도해 주세요":(e.message||"알 수 없는 오류"))+"\n(키가 올바른지, 사용 한도가 남았는지 확인해 주세요)");
  }finally{clearTimeout(to);delete aiBusy[id]}
}
