<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>오프라인 · Linus Company</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--sub:#6e6e73;--ac:#007aff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--sub:#98989d;--ac:#0a84ff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
.c{max-width:360px;width:100%;background:var(--card);border-radius:20px;padding:28px 22px;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 18px;color:var(--sub);line-height:1.6;font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;background:var(--ac);color:#fff;width:100%}
</style></head><body><div class="c"><h1>인터넷에 연결되어 있지 않아요</h1><p>업무 데이터는 안전을 위해 이 기기의 오프라인 저장소에 따로 보관하지 않아요. 연결이 돌아오면 다시 시도해 주세요.</p><button onclick="location.reload()">다시 시도</button></div></body></html>
