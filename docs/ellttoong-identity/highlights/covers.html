<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>얼뚱트립 하이라이트 커버</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 인스타 하이라이트 커버: 1080x1920 (스토리 크기). 가운데 원 안에 들어가는 부분만 보여요. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;gap:30px;padding:30px;flex-wrap:wrap;font-family:Pretendard,sans-serif}
.s{width:1080px;height:1920px;background:#121418;position:relative;flex:none;display:grid;place-items:center}
.c{width:640px;height:640px;border-radius:50%;background:#1d2026;border:10px solid #FFB23F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.c svg{width:260px;height:260px}
.c span{color:#FFB23F;font-weight:900;font-size:64px;letter-spacing:.06em}
</style></head><body>

<section class="s" id="h1-spot"><div class="c">
<svg viewBox="0 0 100 100" fill="none" stroke="#FFB23F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M50 90s28-26 28-48a28 28 0 0 0-56 0c0 22 28 48 28 48z"/><circle cx="50" cy="42" r="10"/></svg>
<span>SPOT</span></div></section>

<section class="s" id="h2-shot"><div class="c">
<svg viewBox="0 0 100 100" fill="none" stroke="#FFB23F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="28" width="80" height="56" rx="10"/><path d="M34 28l6-10h20l6 10"/><circle cx="50" cy="56" r="15"/><circle cx="76" cy="40" r="2" fill="#FFB23F"/></svg>
<span>촬영공식</span></div></section>

<section class="s" id="h3-item"><div class="c">
<svg viewBox="0 0 100 100" fill="none" stroke="#FFB23F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="30" width="60" height="58" rx="12"/><path d="M38 30v-8a12 12 0 0 1 24 0v8"/><path d="M20 54h60"/><path d="M44 54v8h12v-8"/></svg>
<span>여행템</span></div></section>

<section class="s" id="h4-collab"><div class="c">
<svg viewBox="0 0 100 100" fill="#FFB23F"><path d="M50 8c3 22 12 31 34 34-22 3-31 12-34 34-3-22-12-31-34-34 22-3 31-12 34-34z"/><path d="M80 66c1.5 9 5 12.5 14 14-9 1.5-12.5 5-14 14-1.5-9-5-12.5-14-14 9-1.5 12.5-5 14-14z" opacity=".7"/></svg>
<span>협업</span></div></section>

<section class="s" id="h5-japan"><div class="c">
<svg viewBox="0 0 100 100" fill="none" stroke="#FFB23F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30h72"/><path d="M8 22c14 4 70 4 84 0"/><path d="M26 30v58M74 30v58"/><path d="M22 46h56"/><path d="M50 30v16"/></svg>
<span>JAPAN</span></div></section>

</body></html>
