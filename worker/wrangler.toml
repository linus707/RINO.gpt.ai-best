# 명령줄로 올릴 때: cd worker && npx wrangler deploy
# 비밀값은 파일에 적지 말고 아래 명령으로 넣어요 (각각 실행하면 값을 물어봐요)
#   npx wrangler secret put GIST_TOKEN
#   npx wrangler secret put GIST_ID
#   npx wrangler secret put VAPID_PRIVATE_KEY
name = "linus-push"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://linuscompany.co.kr"

# Cloudflare 분산 속도 제한 (선택). 아래 바인딩을 두면 인스턴스가 바뀌어도 이어지는 edge 레벨 제한이 켜져요.
# Wrangler 4.36.0 이상이 필요하고, namespace_id 는 계정 안에서 고유한 양의 정수 문자열이면 돼요. period 는 10 또는 60만 돼요.
# RL: 모든 요청 공통(IP당 분당 120회). RL_AUTH: 로그인·가입만 더 빡빡하게(IP당 분당 20회).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
