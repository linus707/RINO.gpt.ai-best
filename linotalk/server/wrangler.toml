# 리노톡 프록시 서버 설정 (Cloudflare Workers)
#
# 비밀값은 이 파일에 적지 않습니다. 배포할 때 아래 명령으로 넣습니다 (실행하면 값을 물어봐요).
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_TOKEN
# 로컬 실행용 비밀값은 .dev.vars 파일에 둡니다 (.dev.vars.example 참고, 깃에 올라가지 않음).

name = "linotalk-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"

# 요청 내용이 Cloudflare 로그에 남지 않도록 자동 수집 로그는 끕니다.
# (우리 코드가 직접 남기는 로그에는 길이·언어·걸린 시간만 있습니다.)
[observability]
enabled = false

# 요청 제한. namespace_id는 내 Cloudflare 계정 안에서 겹치지 않는 임의의 숫자입니다.
[[ratelimits]]
name = "RL_IP"
namespace_id = "7071"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_DEVICE"
namespace_id = "7072"

  [ratelimits.simple]
  limit = 40
  period = 60
